[target.msp430-none-elf]
# The linker is msp430-elf-gcc (the target default), so linker arguments are gcc arguments.
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-mcpu=msp430",
]

# Cargo appends the ELF path as the last argument and does not run this through a shell, so one is
# asked for explicitly: `$0` is that path.
#
# `tilib` drives the probe through TI's libmsp430, and is the driver to use here — mspdebug's own
# device table (`mspdebug --fet-list`, used by the `rf2500`, `ezfet` and `uif` drivers) does not
# know the FR2xx parts, so those cannot identify this chip. `tilib` works with the LaunchPad's
# on-board eZ-FET and with a separate MSP-FET or MSP-FET430UIF alike; add `-j` to the mspdebug
# arguments for 4-wire JTAG instead of Spy-Bi-Wire.
runner = ["sh", "-c", "mspdebug -q tilib \"prog $0\" reset"]

[build]
target = "msp430-none-elf"

[unstable]
# msp430-none-elf is a tier 3 target: rustup has no prebuilt `core` for it.
build-std = ["core"]
