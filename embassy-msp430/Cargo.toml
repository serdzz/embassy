[package]
name = "embassy-msp430"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embassy Hardware Abstraction Layer (HAL) for TI MSP430 microcontrollers"
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-msp430"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
    "hardware-support",
]

[package.metadata.embassy]
build = [
    {group = "nightly", target = "msp430-none-elf", features = ["msp430fr2355", "defmt"], build-std = ["core"]},
    {group = "nightly", target = "msp430-none-elf", features = ["msp430fr2355", "time-driver-tb0"], build-std = ["core"]},
    {group = "nightly", target = "msp430-none-elf", features = ["msp430f149", "time-driver-tb0"], build-std = ["core"]},
    {group = "nightly", target = "msp430-none-elf", features = ["msp430f2618", "time-driver-tb0"], build-std = ["core"]},
    {group = "nightly", target = "msp430-none-elf", features = ["msp430fr4133", "defmt"], build-std = ["core"]},
    {group = "nightly", target = "msp430-none-elf", features = ["msp430fr4133", "time-driver-ta0"], build-std = ["core"]},
]

[dependencies]
embassy-executor = { version = "0.10.0", path = "../embassy-executor", features = ["platform-msp430"] }
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal" }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", optional = true }
embassy-time-queue-utils = { version = "0.3.0", path = "../embassy-time-queue-utils", optional = true }

embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.7.0"
embedded-io-async = "0.7.0"

critical-section = "1.1"
msp430 = { version = "0.4.1", features = ["critical-section-single-core"] }
msp430-rt = "0.4.1"

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }
document-features = "0.2.7"

# Chip support
msp430fr2355-pac = { package = "msp430fr2355", version = "0.6.1", features = ["rt", "critical-section"], optional = true }
# Not on crates.io; generated and vendored at the repository root.
msp430f149-pac = { package = "msp430f149", version = "0.1.0", path = "../msp430f149-pac", features = ["rt", "critical-section"], optional = true }
msp430f2618-pac = { package = "msp430f2618", version = "0.1.0", path = "../msp430f2618-pac", features = ["rt", "critical-section"], optional = true }
msp430fr6043-pac = { package = "msp430fr6043", version = "0.1.0", path = "../msp430fr6043-pac", features = ["rt", "critical-section"], optional = true }
msp430fr5043-pac = { package = "msp430fr5043", version = "0.1.0", path = "../msp430fr5043-pac", features = ["rt", "critical-section"], optional = true }
# On crates.io only as an abandoned msp430 0.2-era crate, so generated and vendored like the others.
msp430fr4133-pac = { package = "msp430fr4133", version = "0.1.0", path = "../msp430fr4133-pac", features = ["rt", "critical-section"], optional = true }

[features]
default = []

#! ### Chip selection
#! Exactly one chip feature must be enabled.

## MSP430FR2355: 32 kB FRAM, 4 kB SRAM. Every driver in this crate supports it.
msp430fr2355 = ["dep:msp430fr2355-pac"]

## MSP430F149: 60 kB flash, 2 kB SRAM.
##
## The F1xx family shares little with the FR2xx parts below the CPU, so only the drivers that
## genuinely carry over are available: GPIO, the time driver, the clock system and the watchdog.
## Its USARTs and ADC12 have no drivers here yet.
msp430f149 = ["dep:msp430f149-pac"]

## MSP430F2618: 116 kB flash, 8 kB SRAM — but only about 51 kB of that flash is reachable, since
## the rest needs the 20-bit addressing that Rust's msp430 target does not have.
##
## GPIO, the time driver, the clock system and the watchdog are available. Its USCI serial
## peripherals and ADC12 do not have drivers here yet.
msp430f2618 = ["dep:msp430f2618-pac"]

## MSP430FR6043: the ultrasonic sensing part. 64 kB FRAM and 4 kB SRAM, of which about 40 kB of the
## FRAM is reachable — the rest is above 0xFFFF and needs 20-bit addressing that Rust's msp430
## target does not have.
##
## Everything this crate does is available: GPIO, the time driver, the clock system, the watchdog,
## UART, SPI and I2C on its six eUSCIs, PWM on the five Timer_A instances, the ADC12_B converter and
## the RTC_C calendar clock.
##
## The ultrasonic front end is driven too — UUPS, HSPLL, SAPH_A and SDHS — though not to the
## accuracy of TI's own library; see `uss`. The LEA accelerator has no driver.
msp430fr6043 = ["dep:msp430fr6043-pac", "_fr504x_604x"]

## MSP430FR5043: the same ultrasonic sensing device as the MSP430FR6043 without the segment LCD
## driver, in a 64-pin package instead of 80. Identical in every other register, so it runs the same
## drivers; the difference costs about a third less and is easier to buy.
##
## About 40 kB of the 64 kB FRAM is reachable — the rest is above 0xFFFF and needs 20-bit addressing
## that Rust's msp430 target does not have.
msp430fr5043 = ["dep:msp430fr5043-pac", "_fr504x_604x"]

## MSP430FR4133: 15 kB FRAM, 2 kB SRAM, and the LCD_E segment driver — the MSP-EXP430FR4133
## LaunchPad part.
##
## GPIO, the clock system, the watchdog, UART/SPI on eUSCI_A0, SPI/I2C on eUSCI_B0, PWM on the two
## Timer_A3 instances, the 10-bit ADC and the 16-bit RTC counter are all available. There is no
## Timer_B on this device, so the `embassy-time` driver takes Timer0_A3 instead — enable
## `time-driver-ta0`, not `time-driver-tb0`. The LCD_E controller has no driver yet.
msp430fr4133 = ["dep:msp430fr4133-pac"]

#! ### Time driver

## Use Timer_B0 as the `embassy-time` driver. Ticks at 32768 Hz off ACLK, and keeps running in LPM3.
time-driver-tb0 = ["_time-driver", "embassy-time-driver/tick-hz-32_768"]
## Use Timer0_A3 as the `embassy-time` driver, for the devices that have no Timer_B (FR4xx).
## Ticks at 32768 Hz off ACLK, and keeps running in LPM3.
time-driver-ta0 = ["_time-driver", "embassy-time-driver/tick-hz-32_768"]
_time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]

#! ### Internal
## The MSP430FR504x/FR604x family. Set by the chip features above, not by hand: the two devices are
## register-identical bar the LCD, so everything but the peripheral list is written against this
## rather than against either chip.
_fr504x_604x = []

#! ### Logging

## Enable defmt logging
defmt = ["dep:defmt", "embassy-hal-internal/defmt", "embassy-sync/defmt"]
## Enable log logging
log = ["dep:log"]
