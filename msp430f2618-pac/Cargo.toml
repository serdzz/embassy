[package]
name = "msp430f2618"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Peripheral access API for MSP430F2618 microcontrollers (generated using svd2rust)"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["msp430", "pac", "svd2rust"]
repository = "https://github.com/embassy-rs/embassy"

[dependencies]
critical-section = { version = "1.0", optional = true }
msp430 = "0.4.0"
msp430-rt = { version = "0.4.0", optional = true }
vcell = "0.1.0"

[features]
rt = ["msp430-rt/device"]

[package.metadata.docs.rs]
features = ["rt", "critical-section"]
